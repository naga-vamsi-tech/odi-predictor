<!DOCTYPE html>
<html>
<head>
<title>ODI Predictor</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
<div class="container">

<h2>🏏 ODI Match Winner Prediction</h2>

<form action="/predict" method="post">

Team 1:
<select name="team1">
{% for t in teams %}
<option value="{{t}}">{{t}}</option>
{% endfor %}
</select>

Team 2:
<select name="team2">
{% for t in teams %}
<option value="{{t}}">{{t}}</option>
{% endfor %}
</select>

Venue:
<select name="venue">
{% for v in venues %}
<option value="{{v}}">{{v}}</option>
{% endfor %}
</select>

Season:
<select name="season">
{% for s in seasons %}
<option value="{{s}}">{{s}}</option>
{% endfor %}
</select>

Toss Winner:
<select name="toss_winner">
{% for t in teams %}
<option value="{{t}}">{{t}}</option>
{% endfor %}
</select>

Toss Decision:
<select name="toss_decision">
<option value="bat">Bat</option>
<option value="field">Field</option>
</select>

<button type="submit">Predict Winner</button>

</form>

</div>
</body>
</html>

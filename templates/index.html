<!DOCTYPE html>
<html>
<head>
<title>ODI Predictor</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<script>
function updateToss() {
    let team1 = document.getElementById("team1").value;
    let team2 = document.getElementById("team2").value;
    let toss = document.getElementById("toss_winner");

    toss.innerHTML = "";

    let opt1 = document.createElement("option");
    opt1.text = team1;
    opt1.value = team1;
    toss.add(opt1);

    let opt2 = document.createElement("option");
    opt2.text = team2;
    opt2.value = team2;
    toss.add(opt2);
}
</script>
</head>

<body>
<div class="container">

<h2>🏏 ODI Match Winner Prediction</h2>

<form action="/predict" method="post">

<label>Team 1</label>
<select id="team1" name="team1" onchange="updateToss()" required>
{% for t in teams %}
<option>{{ t }}</option>
{% endfor %}
</select>

<label>Team 2</label>
<select id="team2" name="team2" onchange="updateToss()" required>
{% for t in teams %}
<option>{{ t }}</option>
{% endfor %}
</select>

<label>Venue</label>
<select name="venue" required>
{% for v in venues %}
<option>{{ v }}</option>
{% endfor %}
</select>

<label>Season</label>
<select name="season" required>
{% for s in seasons %}
<option>{{ s }}</option>
{% endfor %}
</select>

<label>Toss Winner</label>
<select id="toss_winner" name="toss_winner" required></select>

<label>Toss Decision</label>
<select name="toss_decision" required>
<option value="bat">Bat</option>
<option value="field">Field</option>
</select>

<button type="submit">🔮 Predict Winner</button>

</form>

</div>

<script>
updateToss();
</script>

</body>
</html>
